<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>MONOWEAR — Collection</title>

  <meta
    name="description"
    content="Explore MONOWEAR collections. LIVE THE NAME. WEAR THE MEANING."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      color-scheme: dark;
      --bg: #080808;
      --panel: #111111;
      --text: #f5f5f5;
      --muted: #999999;
      --border: #292929;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 6%;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 5px;
    }

    .header-link {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hero {
      padding: 75px 6% 45px;
      border-bottom: 1px solid var(--border);
    }

    .eyebrow {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 18px 0;
      max-width: 900px;
      font-size: clamp(34px, 7vw, 76px);
      line-height: 0.98;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .description {
      max-width: 600px;
      color: #b0b0b0;
      line-height: 1.8;
      font-size: 14px;
    }

    .content {
      padding: 45px 6% 80px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px;
    }

    .section-head h2 {
      font-size: 14px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    #productCount {
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
    }

    .product {
      min-width: 0;
    }

    .product-image {
      position: relative;
      display: block;
      overflow: hidden;
      aspect-ratio: 3 / 4;
      background: #151515;
    }

    .product-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .product:hover .product-image img {
      transform: scale(1.035);
    }

    .placeholder {
      display: grid;
      place-items: center;
      height: 100%;
      color: #777;
      font-size: 12px;
      letter-spacing: 4px;
    }

    .product-info {
      padding: 15px 0;
    }

    .product-info h3 {
      margin: 0 0 8px;
      font-size: 13px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .product-info p {
      margin: 0;
      color: #c4c4c4;
      font-size: 13px;
    }

    .empty,
    .error {
      padding: 45px 20px;
      border: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      line-height: 1.8;
    }

    .error {
      color: #ffaaaa;
    }

    .button {
      display: inline-block;
      margin-top: 15px;
      padding: 13px 18px;
      border: 1px solid #666;
      background: transparent;
      color: white;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .button:hover {
      background: white;
      color: black;
    }

    .footer {
      padding: 35px 6%;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 2px;
      text-align: center;
    }

    @media (max-width: 760px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .hero {
        padding-top: 55px;
      }

      .content {
        padding-top: 30px;
      }

      .product-info h3 {
        font-size: 11px;
      }
    }

    @media (max-width: 380px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a class="logo" href="/">MONOWEAR<sup>®</sup></a>

    <a class="header-link" href="/">← Back to store</a>
  </header>

  <main>

    <section class="hero">
      <p class="eyebrow">MONOWEAR / COLLECTIONS</p>

      <h1 id="collectionName">Loading collection...</h1>

      <p class="description" id="collectionDescription">
        Discover the collection.
      </p>
    </section>

    <section class="content">

      <div class="section-head">
        <h2>Collection pieces</h2>
        <span id="productCount"></span>
      </div>

      <div id="products" class="grid">
        <div class="empty">Loading collection pieces...</div>
      </div>

      <div id="message" hidden></div>

      <div id="retryArea" hidden style="text-align:center">
        <button class="button" id="retryButton">
          TRY AGAIN ↻
        </button>
      </div>

    </section>

  </main>

  <footer class="footer">
    LIVE THE NAME. WEAR THE MEANING.
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function formatMoney(value) {
      return new Intl.NumberFormat("en-NG", {
        style: "currency",
        currency: "NGN",
        maximumFractionDigits: 0
      }).format(Number(value || 0));
    }

    function getCollectionSlug() {
      const params = new URLSearchParams(location.search);

      return (
        params.get("slug") ||
        params.get("collection") ||
        ""
      ).trim();
    }

    function productImage(product) {
      return product.image || (
        Array.isArray(product.images)
          ? product.images[0] || ""
          : ""
      );
    }

    function renderProducts(products) {
      $("productCount").textContent =
        products.length + (products.length === 1 ? " ITEM" : " ITEMS");

      if (!products.length) {
        $("products").innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            <h3>THE COLLECTION IS TAKING SHAPE.</h3>
            <p>There are no published products in this collection yet.</p>
            <a class="button" href="/">EXPLORE THE STORE ↗</a>
          </div>
        `;
        return;
      }

      $("products").innerHTML = products.map(product => {
        const image = productImage(product);

        const slug = "/product.html?id=" +
  encodeURIComponent(product.id);

        return `
          <article class="product">
            <a class="product-image" href="${escapeHTML(slug)}">
              ${
                image
                  ? `<img
                      src="${escapeHTML(image)}"
                      alt="${escapeHTML(product.name)}"
                      loading="lazy"
                    >`
                  : `<div class="placeholder">MONO</div>`
              }
            </a>

            <div class="product-info">
              <h3>${escapeHTML(product.name)}</h3>
              <p>${formatMoney(product.price)}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadCollection() {
      const slug = getCollectionSlug();

      $("retryArea").hidden = true;
      $("message").hidden = true;

      if (!slug) {
        $("collectionName").textContent = "COLLECTIONS";
        $("collectionDescription").textContent =
          "No collection was specified.";

        $("products").innerHTML = `
          <div class="empty" style="grid-column:1/-1">
            <p>Choose a collection to explore its pieces.</p>
            <a class="button" href="/">RETURN TO STORE ↗</a>
          </div>
        `;

        $("productCount").textContent = "";
        return;
      }

      $("products").innerHTML =
        '<div class="empty" style="grid-column:1/-1">Loading collection...</div>';

      try {
        const response = await fetch(
          "/api/collections/" + encodeURIComponent(slug),
          {
            credentials: "same-origin",
            cache: "no-store"
          }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.error || "We couldn't load this collection."
          );
        }

        $("collectionName").textContent = data.name || "COLLECTION";
        $("collectionDescription").textContent =
          data.description || "Explore the collection.";

        renderProducts(
          Array.isArray(data.products) ? data.products : []
        );

        document.title =
          "MONOWEAR — " + (data.name || "Collection");

      } catch (error) {
        $("collectionName").textContent = "COLLECTION UNAVAILABLE";

        $("products").innerHTML = `
          <div class="error" style="grid-column:1/-1">
            ${escapeHTML(error.message)}
            <br>
            Please try again.
          </div>
        `;

        $("productCount").textContent = "";
        $("retryArea").hidden = false;
      }
    }

    $("retryButton").addEventListener("click", loadCollection);

    loadCollection();
  </script>

</body>
</html>

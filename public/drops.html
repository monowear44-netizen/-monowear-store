<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111111">
  <meta name="description" content="Explore upcoming releases, current drops and archived collections from MONOWEAR.">
  <title>Drops & Archives — MONOWEAR</title>
  <link rel="stylesheet" href="/theme.css">
  <style>
    :root{--bg:#111;--ink:#f2f0e8;--muted:#aaa99f;--line:#33342f;--accent:#c6ff4b}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif;line-height:1.55}
    a{color:inherit;text-decoration:none}.announcement{padding:10px 16px;text-align:center;background:var(--accent);color:#111;font:10px monospace;letter-spacing:.14em}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 5.5%;border-bottom:1px solid var(--line)}.logo{font-size:25px;font-weight:800;letter-spacing:-.08em}.back{font:10px monospace;letter-spacing:.1em}
    main{max-width:1240px;margin:auto;padding:48px 5.5% 80px}.eyebrow{font:10px monospace;letter-spacing:.15em;color:var(--muted)}h1{font-size:clamp(42px,8vw,92px);letter-spacing:-.08em;line-height:.94;margin:14px 0 20px}.intro{max-width:580px;color:var(--muted);margin-bottom:48px}
    .drop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.drop-card{border:1px solid var(--line);background:#171815;display:flex;flex-direction:column;min-width:0}.cover{width:100%;aspect-ratio:4/3;object-fit:cover;background:#20211d}.cover-empty{aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(circle at 70% 30%,#30352a,#171815 60%);font-size:clamp(28px,6vw,62px);font-weight:800;letter-spacing:-.08em;color:#ffffff20}.drop-copy{padding:22px}.status{display:inline-block;color:var(--accent);font:10px monospace;letter-spacing:.12em;margin-bottom:12px}.drop-copy h2{font-size:clamp(23px,3vw,38px);letter-spacing:-.05em;line-height:1.05;margin:0 0 10px}.drop-copy p{font-size:13px;color:var(--muted);white-space:pre-line}.date{font:11px monospace;letter-spacing:.06em;color:var(--ink);margin:16px 0}.countdown{color:var(--accent);font:11px monospace;margin:8px 0 18px}.products{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.products span{border:1px solid var(--line);padding:6px 9px;font-size:10px;color:#d5d5cd}.empty{padding:30px;border:1px solid var(--line);color:var(--muted)}footer{border-top:1px solid var(--line);padding:24px 5.5%;color:var(--muted);font:10px monospace;letter-spacing:.08em}
    @media(max-width:680px){header{padding:18px 5%}.drop-grid{grid-template-columns:1fr}main{padding-top:36px}.drop-copy{padding:18px}}
  </style>
</head>
<body>
  <div class="announcement">LIVE THE NAME. WEAR THE MEANING.</div>
  <header><a class="logo" href="/">MONOWEAR<span style="font-size:10px;vertical-align:top">®</span></a><a class="back" href="/">← BACK TO STORE</a></header>
  <main>
    <p class="eyebrow">MONOWEAR / RELEASES</p>
    <h1>Drops &<br><i>archives.</i></h1>
    <p class="intro">Every release carries a story. Explore what is coming, what is available now, and the pieces that have become part of the MONOWEAR archive.</p>
    <div id="drops" class="drop-grid" aria-live="polite"><p class="empty">Loading releases…</p></div>
  </main>
  <footer>© <span id="year"></span> MONOWEAR. INDEPENDENT BY DESIGN.</footer>
  <script>
    (function(){
      var root=document.getElementById("drops");
      document.getElementById("year").textContent=new Date().getFullYear();
      function safe(value){return String(value==null?"":value).replace(/[&<>"']/g,function(ch){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];});}
      function localDate(value){
        if(!value)return null;
        var parts=String(value).split("-").map(Number);
        if(parts.length!==3||parts.some(Number.isNaN))return null;
        return new Date(parts[0],parts[1]-1,parts[2],0,0,0);
      }
      function card(drop){
        var date=localDate(drop.release_date);
        var upcoming=date&&date.getTime()>new Date(new Date().toDateString()).getTime();
        var status=drop.archived?"FROM THE ARCHIVE":(upcoming?"COMING SOON":"LIVE / RELEASE");
        var cover=drop.cover_image?'<img class="cover" src="'+safe(drop.cover_image)+'" alt="'+safe(drop.name)+' cover">':'<div class="cover-empty" aria-hidden="true">MONO</div>';
        var names=(drop.products||[]).map(function(p){return '<span>'+safe(p.name)+'</span>';}).join("");
        var release=date?'<div class="date">RELEASE DATE · '+safe(drop.release_date)+'</div>':"";
        var countdown=upcoming&&!drop.archived?'<div class="countdown" data-countdown="'+safe(drop.release_date)+'">COUNTDOWN LOADING…</div>':"";
        return '<article class="drop-card">'+cover+'<div class="drop-copy"><span class="status">'+status+'</span><h2>'+safe(drop.name)+'</h2><p>'+safe(drop.description||"A MONOWEAR release.")+'</p>'+release+countdown+(names?'<div class="products">'+names+'</div>':'<p>Pieces will appear here as products are published.</p>')+'<a class="status" href="/#shop">SHOP THE STORE ↗</a></div></article>';
      }
      function tick(){
        root.querySelectorAll("[data-countdown]").forEach(function(el){
          var date=localDate(el.getAttribute("data-countdown"));
          if(!date)return;
          var remaining=date.getTime()-Date.now();
          if(remaining<=0){el.textContent="THE DROP IS HERE.";return;}
          var days=Math.floor(remaining/86400000);
          var hours=Math.floor((remaining%86400000)/3600000);
          var minutes=Math.floor((remaining%3600000)/60000);
          var seconds=Math.floor((remaining%60000)/1000);
          el.textContent=days+"D  "+hours+"H  "+minutes+"M  "+seconds+"S";
        });
      }
      fetch("/api/drops",{cache:"no-store"}).then(function(response){
        if(!response.ok)throw new Error("Unable to load drops.");
        return response.json();
      }).then(function(drops){
        if(!Array.isArray(drops)||!drops.length){
          root.innerHTML='<p class="empty">No public drops yet. New releases will appear here when MONOWEAR publishes them.</p>';
          return;
        }
        root.innerHTML=drops.map(card).join("");
        tick();
        window.setInterval(tick,1000);
      }).catch(function(){
        root.innerHTML='<p class="empty">Drops are temporarily unavailable. Please refresh in a moment.</p>';
      });
    })();
  </script>
  <script src="/theme.js?v=custom-colors-20261015" defer></script>
</body>
</html>

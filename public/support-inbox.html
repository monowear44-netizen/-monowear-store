<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0b0c0b"><title>MONOWEAR Studio — Support Inbox</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b0c0b;color:#f4f2eb;font:14px Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center;padding:20px 5%;border-bottom:1px solid #292c28}.logo{font-size:20px;font-weight:800;letter-spacing:.12em}.logo span{color:#39ff14}.top a{color:#39ff14;font:10px monospace;letter-spacing:.1em;text-decoration:none}.wrap{max-width:1200px;margin:auto;padding:32px 4%}.eyebrow{font:10px monospace;letter-spacing:.16em;color:#39ff14}.title{font-size:clamp(32px,5vw,54px);letter-spacing:-.07em;margin:10px 0 26px}.grid{display:grid;grid-template-columns:minmax(240px,.85fr) minmax(0,1.5fr);gap:18px}.box{border:1px solid #2c302a;background:#101210;min-height:350px}.box h2{font-size:12px;letter-spacing:.12em;font-family:monospace;padding:16px;margin:0;border-bottom:1px solid #292c28}.threads{max-height:65vh;overflow:auto}.thread{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #292c28;padding:15px;background:transparent;color:#f4f2eb}.thread:hover,.thread.active{background:#1a2018}.thread strong{display:block;font-size:12px;margin-bottom:6px}.thread small{display:block;color:#999c93;font-size:10px;margin-bottom:7px}.thread p{color:#b7bab2;font-size:11px;line-height:1.5;margin:0;overflow-wrap:anywhere}.badge{display:inline-block;color:#111;background:#39ff14;padding:4px 6px;font:8px monospace;margin-top:8px}.badge.closed{background:#555;color:white}.conversation{display:flex;flex-direction:column;min-height:350px}.messages{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto;max-height:50vh;flex:1}.msg{max-width:90%;padding:12px;background:#191c18;border:1px solid #2c302a;font-size:12px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}.msg.customer{align-self:flex-start}.msg.assistant{align-self:flex-start;border-left:2px solid #39ff14}.msg.admin{align-self:flex-end;background:#e4ffd9;color:#111}.msg small{display:block;color:#999c93;font:9px monospace;margin-top:6px}.reply{display:flex;gap:8px;padding:14px;border-top:1px solid #292c28}.reply textarea{min-height:70px;resize:vertical;flex:1;min-width:0;background:#0b0c0b;border:1px solid #373b35;color:#f4f2eb;padding:12px}.btn{border:0;background:#39ff14;color:#111;padding:12px 14px;font:700 10px monospace;letter-spacing:.08em}.empty{padding:22px;color:#999c93;font-size:12px;line-height:1.7}.tools{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-top:1px solid #292c28}.tools button{border:1px solid #444;background:transparent;color:#ddd;padding:8px;font:9px monospace}.status{font:10px monospace;color:#999c93}@media(max-width:720px){.grid{grid-template-columns:1fr}.threads{max-height:35vh}.messages{max-height:42vh}.top{padding:18px 4%}.wrap{padding:24px 4%}}</style></head>
<body><header class="top"><div class="logo">MONOWEAR<span>®</span> / SUPPORT</div><a href="/studio">← BACK TO STUDIO</a></header><main class="wrap"><p class="eyebrow">CUSTOMER CARE / PRIVATE INBOX</p><h1 class="title">Support <i>conversations.</i></h1><div class="grid"><section class="box"><h2>INBOX <span id="count"></span></h2><div class="threads" id="threads"><p class="empty">Loading conversations…</p></div></section><section class="box conversation"><h2 id="conversationTitle">SELECT A CONVERSATION</h2><div class="messages" id="messages"><p class="empty">Choose a conversation to read and reply.</p></div><div class="tools"><span class="status" id="status">No conversation selected</span><button id="closeThread" type="button" disabled>CLOSE TICKET</button></div><form class="reply" id="replyForm"><textarea id="replyText" maxlength="2000" placeholder="Write a reply to the customer…" required disabled></textarea><button class="btn" id="replyButton" type="submit" disabled>SEND ↗</button></form></section></div><p class="status" id="notice" role="status" aria-live="polite" style="margin-top:18px"></p></main>
<script>(()=>{const $=id=>document.getElementById(id);let selected="",activeMessages=[];function esc(s){return String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}async function api(url,options){const r=await fetch(url,Object.assign({credentials:"same-origin",cache:"no-store"},options||{}));const d=await r.json();if(!r.ok)throw new Error(d.error||"Request failed");return d;}async function loadThreads(){try{const d=await api("/api/support/inbox");$("count").textContent="("+d.threads.length+")";const list=$("threads");list.innerHTML="";if(!d.threads.length){list.innerHTML='<p class="empty">No customer conversations yet. Storefront chat messages will appear here.</p>';return;}d.threads.forEach(t=>{const b=document.createElement("button");b.type="button";b.className="thread"+(t.id===selected?" active":"");b.innerHTML='<strong>'+esc(t.customer_name||"MONOWEAR customer")+'</strong><small>'+esc(t.customer_email||"No email provided")+' · '+esc(t.updated_at)+'</small><p>'+esc(t.last_message||"New conversation")+'</p><span class="badge '+(t.status==="closed"?"closed":"")+'">'+esc(t.status.replace("_"," ").toUpperCase())+'</span>';b.addEventListener("click",()=>openThread(t.id));list.appendChild(b);});}catch(e){$("threads").innerHTML='<p class="empty">'+esc(e.message)+'. Open MONOWEAR Studio and sign in, then reload this page.</p>';}}async function openThread(id){selected=id;try{const d=await api("/api/support/inbox/"+encodeURIComponent(id));$("conversationTitle").textContent=(d.thread.customer_name||"CUSTOMER")+" / "+(d.thread.customer_email||"NO EMAIL");$("status").textContent=d.thread.status.toUpperCase();$("closeThread").disabled=d.thread.status==="closed";$("replyText").disabled=d.thread.status==="closed";$("replyButton").disabled=d.thread.status==="closed";activeMessages=d.messages||[];renderMessages();loadThreads();}catch(e){$("notice").textContent=e.message;}}function renderMessages(){const el=$("messages");el.innerHTML="";activeMessages.forEach(m=>{const b=document.createElement("div");b.className="msg "+m.sender;b.textContent=(m.sender==="admin"?"YOUR REPLY":m.sender==="customer"?"CUSTOMER":"MONO SUPPORT")+": "+m.message;const time=document.createElement("small");time.textContent=m.created_at;b.appendChild(time);el.appendChild(b);});el.scrollTop=el.scrollHeight;}$("replyForm").addEventListener("submit",async e=>{e.preventDefault();if(!selected)return;const message=$("replyText").value.trim();if(!message)return;$("replyButton").disabled=true;try{await api("/api/support/inbox/"+encodeURIComponent(selected)+"/reply",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message})});$("replyText").value="";$("notice").textContent="Reply saved. It will appear in the customer's open chat.";await openThread(selected);}catch(err){$("notice").textContent=err.message;}finally{$("replyButton").disabled=false;}});$("closeThread").addEventListener("click",async()=>{if(!selected)return;try{await api("/api/support/inbox/"+encodeURIComponent(selected)+"/close",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});await openThread(selected);$("notice").textContent="Conversation closed.";}catch(e){$("notice").textContent=e.message;}});loadThreads();setInterval(()=>{loadThreads();if(selected)openThread(selected);},12000);})();</script></body></html>

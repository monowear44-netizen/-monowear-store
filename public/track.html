<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f3ef"><meta name="description" content="Track your MONOWEAR shipment. Email is optional.">
<title>Track Your Order — MONOWEAR</title>
<style>
:root{--bg:#f4f3ef;--paper:#fff;--ink:#171816;--muted:#777970;--line:#e5e5df;--accent:#c6ff4b;--done:#283d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}
.announcement{background:#171816;color:#fff;text-align:center;padding:9px 14px;font:10px monospace;letter-spacing:.16em}header{height:76px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-size:24px;font-weight:900;letter-spacing:-.09em}.back{font-size:10px;font-weight:700;letter-spacing:.12em}
main{width:min(760px,100%);margin:0 auto;padding:36px 18px 70px}.eyebrow{font:10px monospace;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}h1{font-size:clamp(30px,7vw,43px);line-height:1.06;letter-spacing:-.055em;margin:9px 0}.intro{font-size:13px;color:var(--muted);margin:0 0 25px}
.lookup,.panel{background:var(--paper);border:1px solid var(--line);border-radius:3px;padding:22px}.field label{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;margin:0 0 8px}
input{width:100%;border:1px solid #dcded5;border-radius:2px;background:#fbfbf8;padding:14px 12px;font-size:14px;margin-bottom:15px;min-height:46px;color:var(--ink)}input:focus{outline:2px solid var(--accent);outline-offset:1px}
button{width:100%;min-height:48px;background:var(--ink);color:#fff;border:0;border-radius:2px;padding:14px;font:11px monospace;letter-spacing:.13em;font-weight:700;cursor:pointer}button:disabled{opacity:.55}.message{font-size:12px;margin:13px 0 0;color:#a32626}.optional{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:0}
.panel{margin-top:18px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line);padding-bottom:17px}.order-ref{font-size:12px;font-weight:700;overflow-wrap:anywhere}
.status{display:inline-block;background:var(--accent);padding:6px 9px;font:10px monospace;text-transform:uppercase;white-space:nowrap}h2{font-size:21px;letter-spacing:-.035em;margin:6px 0 0}.muted{font-size:12px;color:var(--muted);margin:5px 0}
.section-title{font-size:10px;letter-spacing:.14em;font-weight:700;margin:20px 0 12px}.items{display:grid;gap:10px}.item{display:flex;align-items:center;gap:13px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}
.item img,.placeholder{width:62px;height:72px;object-fit:cover;background:#f0f0eb;flex:0 0 62px}.placeholder{display:grid;place-items:center;font-size:9px;color:var(--muted)}.item-name{font-size:12px;font-weight:700}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}.item-qty{font-size:11px;margin-left:auto;white-space:nowrap;color:var(--muted)}
.summary{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:13px;font-size:12px}.summary strong{font-size:14px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0 18px}.progress span{height:4px;background:#e6e7e1}.progress span.done{background:var(--done)}.progress span.current{background:var(--accent)}
.timeline{margin:4px 0 0 5px;padding:0 0 0 22px;border-left:1px solid #d9dcd2}.event{position:relative;padding:0 0 20px}.event:last-child{padding-bottom:2px}.event:before{content:"";position:absolute;left:-27px;top:3px;width:9px;height:9px;border-radius:50%;background:#e5e7df;border:1px solid #cfd2c7}.event.done:before{background:var(--done);border-color:var(--done)}.event.current:before{background:var(--accent);border:2px solid var(--ink)}.event strong{font-size:12px}.event p{font-size:11px;color:var(--muted);margin:3px 0 0}.event time{font-size:10px;color:#888b82}
.support{margin-top:22px;font-size:11px;color:var(--muted);text-align:center}.support a{text-decoration:underline;text-underline-offset:3px}.order-wardrobe-rail{height:min(58svh,460px);min-height:310px;margin:12px 0 22px;border:1px solid var(--line)}.order-wardrobe-rail .wr-rail{padding:54px 7vw 0}.order-wardrobe-rail .wr-track{gap:22px}.order-wardrobe-rail .wr-it{width:132px}.order-wardrobe-rail .wr-it img{width:132px;height:164px}.order-wardrobe-rail .wr-it.jean img{height:184px}.order-wardrobe-rail .wr-it.cap img{height:100px}.order-wardrobe-rail .wr-hint{bottom:12px}.order-rail-placeholder{width:132px;height:164px;display:grid;place-items:center;background:#eeeee8;color:#777970;font-size:11px;letter-spacing:.2em}.order-wardrobe-rail .wr-it small{max-width:132px;text-align:center;line-height:1.35;overflow-wrap:anywhere}.order-wardrobe-rail .wr-tag{white-space:nowrap}footer{border-top:1px solid var(--line);padding:22px 5%;font:10px monospace;letter-spacing:.08em;color:var(--muted)}[hidden]{display:none!important}
@media(max-width:520px){header{height:66px}.logo{font-size:22px}main{padding:27px 14px 54px}.lookup,.panel{padding:17px}.topline{flex-direction:column;align-items:flex-start}.item img,.placeholder{width:54px;height:65px;flex-basis:54px}}
</style><link rel="stylesheet" href="/theme.css"><link rel="stylesheet" href="/wardrobe-rail.css?v=order-rail-20261026-1">
  <link rel="stylesheet" href="/support-widget.css">
</head>
<body>
<div class="announcement">LIVE THE NAME. WEAR THE MEANING.</div>
<header><a class="logo" href="/">MONOWEAR<span style="font-size:9px;vertical-align:top">®</span></a><a class="back" href="/">← BACK TO STORE</a></header>
<main><p class="eyebrow">ORDER CARE / MONOWEAR</p><h1>Track your shipment.</h1><p class="intro">See your order details and the latest delivery status recorded by MONOWEAR.</p>
<form class="lookup" id="trackForm">
<div class="field"><label for="reference">ORDER REFERENCE</label><input id="reference" name="reference" autocomplete="off" required maxlength="120" placeholder="Enter your order reference"></div>
<div class="field"><label for="email">EMAIL ADDRESS <span class="optional">(OPTIONAL)</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="Add email for an extra check"></div>
<button id="submitButton" type="submit">TRACK MY ORDER ↗</button><p class="message" id="message" role="status" aria-live="polite"></p>
</form>
<section class="panel" id="result" hidden aria-live="polite"></section>
<p class="support">Need help with an order? <a href="mailto:monowear44@gmail.com?subject=MONOWEAR%20Order%20Support">Contact MONOWEAR support ↗</a></p></main>
<footer>© <span id="year"></span> MONOWEAR. INDEPENDENT BY DESIGN.</footer>
<script>
const form=document.getElementById("trackForm"),message=document.getElementById("message"),result=document.getElementById("result"),button=document.getElementById("submitButton");
document.getElementById("year").textContent=new Date().getFullYear();
const query=new URLSearchParams(location.search);if(query.get("reference"))form.reference.value=query.get("reference").slice(0,120);if(query.get("email"))form.email.value=query.get("email").slice(0,254);
const safe=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nice=v=>String(v||"pending").replace(/[_-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const money=v=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(Number(v)||0);
const stages=[{label:"Order confirmed",desc:"Your order has been received."},{label:"Preparing your order",desc:"Your order is being prepared."},{label:"Shipped / in transit",desc:"Your parcel has been handed over for delivery."},{label:"Delivered",desc:"Your order has been delivered."}];
function stageIndex(status){const s=String(status||"").toLowerCase().replace(/[_ ]+/g,"-");if(/deliver/.test(s))return 3;if(/out-for-delivery|in-transit|transit|shipped|dispatched|fulfilled/.test(s))return 2;if(/process|prepar|paid|ready|packed/.test(s))return 1;if(/cancel|failed|refund/.test(s))return -1;return 0}
function displayDate(value){if(!value)return "";const d=new Date(String(value).replace(" ","T")+"Z");return Number.isNaN(d.getTime())?String(value):d.toLocaleString("en-NG",{dateStyle:"medium",timeStyle:"short"})}
form.addEventListener("submit",async e=>{
e.preventDefault();message.textContent="Looking up your order…";result.hidden=true;button.disabled=true;
const ref=form.reference.value.trim(),email=form.email.value.trim();
try{
const response=await fetch("/api/orders/track/"+encodeURIComponent(ref)+"?email="+encodeURIComponent(email),{headers:{Accept:"application/json"},cache:"no-store"});const data=await response.json();
if(!response.ok)throw new Error(data.error||"We couldn't find that order. Check your reference.");
const order=data.order||{},events=Array.isArray(data.events)?data.events:[],items=Array.isArray(order.items)?order.items:[],current=stageIndex(order.order_status);
const progress=stages.map((s,i)=>'<span class="'+(current>=0&&i<current?"done":current===i?"current":"")+'"></span>').join("");
const railHook=(type)=>type==="cap"?'<svg viewBox="0 0 46 30" aria-hidden="true"><path d="M23 29V16c0-5 6-4 6-9a6 6 0 0 0-12 0" fill="none" stroke="currentColor" stroke-width="2"/></svg>':'<svg viewBox="0 0 46 30" aria-hidden="true"><path d="M23 12V8.5c0-5 6-4 6-8M23 12L2 28h42z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
const railType=(name)=>/jean|trouser|pant|flare/i.test(String(name||""))?"jean":/cap|hat|beanie/i.test(String(name||""))?"cap":"top";
const itemHtml=items.length?items.map(item=>'<button class="wr-it '+railType(item.name)+'" type="button" aria-label="'+safe(item.name)+' quantity '+safe(item.quantity)+'">'+railHook(railType(item.name))+(item.image?'<img src="'+safe(item.image)+'" alt="'+safe(item.name)+'" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'order-rail-placeholder\',textContent:\'MONO\'}))">':'<div class="order-rail-placeholder">MONO</div>')+'<small>'+safe(item.name)+'</small><span class="wr-tag">QTY × '+safe(item.quantity)+'</span></button>').join(""):'<p class="muted">Product details are not available for this order.</p>';
let timeline="";
if(current<0)timeline='<div class="event current"><strong>'+safe(nice(order.order_status))+'</strong><p>Please contact MONOWEAR if you need help with this order.</p></div>';
else timeline=stages.map((s,i)=>{const matches=events.filter(ev=>stageIndex(ev.status)===i),last=matches[matches.length-1],cls=i<current?"done":i===current?"current":"";return '<div class="event '+cls+'"><strong>'+safe(s.label)+'</strong><p>'+safe(last?.message||s.desc)+'</p>'+(last?.created_at?'<time>'+safe(displayDate(last.created_at))+'</time>':"")+'</div>'}).join("");
result.innerHTML='<div class="topline"><div><div class="eyebrow">ORDER REFERENCE</div><div class="order-ref">'+safe(order.reference||ref)+'</div><h2>Shipment progress</h2><p class="muted">Placed '+safe(displayDate(order.created_at)||"date unavailable")+'</p></div><span class="status">'+safe(nice(order.order_status))+'</span></div><div class="section-title">YOUR ITEMS / ON THE RAIL</div><section class="wr order-wardrobe-rail" aria-label="Your ordered items"><div class="wr-rail"><div class="wr-track">'+itemHtml+'</div></div><div class="wr-hint">YOUR ORDER · HANGING ON THE RAIL</div></section><div class="summary"><span>Payment · '+safe(nice(order.payment_status))+'</span><strong>'+safe(money(order.total))+'</strong></div><div class="section-title">DELIVERY PROGRESS</div><div class="progress">'+progress+'</div><div class="timeline">'+timeline+'</div><p class="muted" style="margin-top:18px">Updates reflect the latest information saved by MONOWEAR. Live carrier movement appears only when supported by a carrier integration.</p>';
result.hidden=false;message.textContent="";
}catch(err){message.textContent=err.message||"We couldn't retrieve your order. Please try again."}finally{button.disabled=false}
});
</script><script src="/theme.js?v=tracking-refresh-20261026" defer></script>
  <script src="/support-widget.js" defer></script>
</body></html>
